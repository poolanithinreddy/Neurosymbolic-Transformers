# FEVER Gold Evidence — Neural Large Baseline (Setting A)
# DeBERTa-v3-large + LoRA (no constraints, pure NLI)
# Strong baseline for ablation comparison against NST-VERI

mode: "neural"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_fever_gold_neural_large"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  max_train: null
  max_dev: null
  dev_sample: 2000
  dev_test_ratio: 0.1

train:
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4          # effective batch = 64
  lr: 1.0e-5
  lr_lora: 3.0e-4
  lr_heads: 5.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  fused_optimizer: true
  eval_every_steps: 250
  eval_strategy: "steps"
  patience: 5
  num_workers: 4

logic:
  lambda: 0.0
