# FEVER Gold — Neural Baseline 10K (A100, Fair Comparison)
# DeBERTa-v3-large + LoRA, NO constraints
# Same backbone as NST-VERI for fair comparison

mode: "neural"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_neural_10k"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 3
  label_smoothing: 0.03
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  evidence_mode: "gold"
  max_train: 12000
  max_dev: 3000
  dev_sample: 1500
  dev_test_ratio: 0.1

train:
  epochs: 5
  batch_size: 32
  grad_accum_steps: 2
  lr: 1.5e-5
  lr_lora: 4.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  eval_every_steps: 100
  eval_strategy: "steps"
  patience: 10
  num_workers: 4

logic:
  lambda: 0.0
