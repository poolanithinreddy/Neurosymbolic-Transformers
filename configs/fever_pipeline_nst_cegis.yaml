# FEVER Full Pipeline — NST CEGIS (Setting B)
# DeBERTa-v3-base + BM25 retrieval + Lagrangian + CEGIS
# Expected: constraint regularization helps with noisy retrieved evidence

mode: "cegis"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "pipeline"

io:
  out_dir: "outputs_fever_pipeline_nst_cegis"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 256

data:
  max_train: null
  max_dev: null
  dev_sample: 2000

retrieval:
  top_k: 5
  cache_dir: "retrieval_cache"
  use_synthetic: true

train:
  epochs: 3
  batch_size: 16
  grad_accum_steps: 2
  lr: 2.0e-5
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  eval_every_steps: 500
  patience: 5

logic:
  lambda: 0.05
  lambda_lr: 0.01
  lambda_max: 2.0
  constraint_weights:
    date_contradiction: 1.0
    number_contradiction: 1.0
    negation_mismatch: 0.8
    low_entity_overlap: 0.5
    empty_evidence: 0.3

cegis:
  max_rounds: 5
  mine_top_k: 200
  ce_epochs: 1
  ce_batch_size: 16
  violation_threshold: 0.5
