# FEVER Gold Evidence — NST Gated / ECCG (Setting A)
# DeBERTa-v3-base + Evidence-Conditioned Constraint Gating (novel)
# Expected: best overall accuracy + calibration via learned per-sample gates

mode: "gated"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_fever_gold_nst_gated"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 256

data:
  max_train: null
  max_dev: null
  dev_sample: 2000

train:
  epochs: 4
  batch_size: 16
  grad_accum_steps: 2
  lr: 2.0e-5
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  eval_every_steps: 500
  patience: 5

logic:
  lambda: 0.05                # initial lambda (Lagrangian adaptive)
  lambda_lr: 0.01             # lambda update rate
  lambda_max: 2.0             # lambda ceiling
  epsilon: 0.05               # Lagrangian slack
  constraint_weights:         # used as base_weights (overridden by gate)
    date_contradiction: 1.0
    number_contradiction: 1.0
    negation_mismatch: 0.8
    low_entity_overlap: 0.5
    empty_evidence: 0.3

# ECCG gate configuration (novel)
gate:
  hidden_dim: 16              # gate network hidden layer
  dropout: 0.1                # gate dropout
  init_bias: 0.5              # sigmoid(0.5) ≈ 0.62, gates start moderately open
  lr_multiplier: 10.0         # gate lr = backbone_lr * multiplier
