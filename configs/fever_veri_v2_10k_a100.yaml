# FEVER Gold — NST-VERI v2 10K (A100 Optimized)
# Learned multi-task architecture: NLI + contradiction + relevance + contrastive + R-Drop
# Replaces heuristic constraint engine with learned neural heads
# Two-phase schedule: warmup → full multi-task

mode: "veri_v2"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_veri_v2_10k"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  evidence_mode: "gold"
  max_train: 12000
  max_dev: 3000
  dev_sample: 1500
  dev_test_ratio: 0.1

train:
  epochs: 8
  batch_size: 32
  grad_accum_steps: 2
  lr: 2.0e-5
  lr_lora: 5.0e-4
  lr_heads: 5.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: false
  fp16: false
  tf32: true
  torch_compile: false
  fused_optimizer: false
  eval_every_steps: 100
  eval_strategy: "steps"
  patience: 15
  num_workers: 4
  focal_loss: false

veri:
  beta_contradiction: 0.3
  beta_relevance: 0.3
  gamma_contrastive: 0.1
  contrastive_temperature: 0.07
  rdrop_alpha: 0.5
  focal_gamma: 2.0
  refutes_gamma: 3.0
  use_symbolic_at_inference: true
