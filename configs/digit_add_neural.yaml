# Digit Addition — Pure Neural Baseline
# No symbolic constraints (ablation baseline)

mode: "neural"
device: "auto"
seed: 42

io:
  out_dir: "outputs_digit_add_neural"

data:
  n_train: 10000
  n_test: 2000
  comp_threshold: 9
  img_size: 28
  noise_std: 0.15

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-3
  warmup_steps: 0

logic:
  lambda: 0.0
  cagrad_c: 0.0
