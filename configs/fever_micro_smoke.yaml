# FEVER Micro Smoke Test — designed to complete in <2 min on CPU
# Uses tiny BERT model (4.4M params) instead of DeBERTa (184M)
# 50 train / 25 dev / 2 epochs / batch_size 4

mode: "neural"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_fever_micro_smoke"

model:
  name: "google/bert_uncased_L-2_H-128_A-2"
  num_labels: 3
  label_smoothing: 0.0
  dropout: 0.1
  max_length: 64

data:
  max_train: 50
  max_dev: 25
  dev_sample: 25

train:
  epochs: 2
  batch_size: 4
  grad_accum_steps: 1
  lr: 5e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  eval_every_steps: 13
  patience: 5

logic:
  lambda: 0.0
