# FEVER Gold Evidence — NST-VERI Full A100 Config (Setting A)
# Flagship: DeBERTa-v3-large + LoRA + 3-phase verification-enhanced training
# Target: 90%+ gold-evidence label accuracy with honest evaluation
#
# Hardware: A100 40/80GB (or Colab A100)
# Estimated time: ~2-3 hours on A100

mode: "veri"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_fever_gold_nst_veri"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  max_train: null              # Full ~145K train
  max_dev: null                # Full ~19K labelled_dev
  dev_test_ratio: 0.1
  dev_sample: 2000

train:
  epochs: 5
  batch_size: 8
  grad_accum_steps: 8          # Effective batch size = 64
  lr: 1.0e-5
  lr_lora: 3.0e-4
  lr_heads: 5.0e-4
  lr_gate: 1.0e-3
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  torch_compile: false          # Enable if PyTorch 2.x stable
  fused_optimizer: true
  focal_loss: true
  focal_gamma: 2.0
  eval_every_steps: 250
  patience: 6
  num_workers: 4

veri:
  n_constraints: 6
  lambda_max: 0.3
  contrastive_temperature: 0.07
  beta_aux: 1.0
  gamma_contrastive: 0.1
