# FEVER Gold — NST-VERI 3k Smoke Test (Rapid Iteration)
# DeBERTa-v3-large + LoRA — same architecture as full run
# 3000 train / 1000 dev / 4 epochs — should run in ~3-5 min on A100
# Purpose: validate constraints are active and show signal before long run

mode: "veri"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_veri_smoke_3k"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 3
  label_smoothing: 0.05
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  evidence_mode: "gold"
  max_train: 3000
  max_dev: 1000
  dev_sample: 500
  dev_test_ratio: 0.1

train:
  epochs: 4
  batch_size: 16
  grad_accum_steps: 2          # effective batch = 32 (smaller for faster iteration)
  lr: 2.0e-5                   # Slightly higher LR for fast convergence on small data
  lr_lora: 5.0e-4
  lr_heads: 1.0e-3
  lr_gate: 3.0e-3              # Fast gate learning
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  torch_compile: false
  fused_optimizer: false
  eval_every_steps: 50         # Frequent eval for fast loop
  patience: 50                 # Never early stop in smoke test
  num_workers: 0
  focal_loss: true
  focal_gamma: 2.0

veri:
  n_constraints: 6
  lambda_max: 2.0              # Strong constraint signal
  contrastive_temperature: 0.07
