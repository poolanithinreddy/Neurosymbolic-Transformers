# FEVER Gold — NST-VERI 10K (A100 Optimized)
# DeBERTa-v3-large + LoRA + 7 verification heads + contrastive + adaptive lambda
# 3-phase: NLI+aux → +contrastive → +uncertainty-focused constraints
# v2.1 constraint engine with high-precision design

mode: "veri"
device: "auto"
seed: 42

task: "fever"
evidence_mode: "gold"

io:
  out_dir: "outputs_veri_10k"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 3
  label_smoothing: 0.03
  dropout: 0.1
  max_length: 384
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  gradient_checkpointing: true

data:
  evidence_mode: "gold"
  max_train: 12000
  max_dev: 3000
  dev_sample: 1500
  dev_test_ratio: 0.1

train:
  epochs: 8
  batch_size: 32
  grad_accum_steps: 2
  lr: 3.0e-5
  lr_lora: 8.0e-4
  lr_heads: 8.0e-4
  lr_gate: 2.0e-3
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: false
  fp16: false
  tf32: true
  torch_compile: false
  fused_optimizer: false
  eval_every_steps: 100
  eval_strategy: "steps"
  patience: 15
  num_workers: 4
  focal_loss: true
  focal_gamma: 2.0

veri:
  n_constraints: 7
  lambda_max: 0.5
  contrastive_temperature: 0.07
  beta_aux: 0.3
  gamma_contrastive: 0.1
  use_adaptive_lambda: true

logic:
  lambda: 0.0
