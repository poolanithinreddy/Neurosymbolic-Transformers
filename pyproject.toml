[project]
name = "nst"
version = "0.3.0"
description = "Neurosymbolic Transformers (NST): counterexample-guided training with augmented Lagrangian constraints"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Nithin Reddy Poola", email = "poolanithinreddy@gmail.com" }]
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "tokenizers>=0.19.0",
  "accelerate>=0.28.0",
  "peft>=0.10.0",
  "datasets>=2.18.0",
  "scikit-learn>=1.3.0",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "black>=24.0",
  "mypy>=1.8.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pre-commit>=3.5",
  "matplotlib>=3.8",
]
grounding = [
  "spacy>=3.8.0,<3.9",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = false

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "models*",
  "training*",
  "symbolic*",
  "eval*",
  "logic*",
  "decoding*",
  "grounding*",
  "retrieval*",
  "data*",
  "scripts*",
]
exclude = [
  "tests*",
  "configs*",
  "colab*",
  "scripts*",
  "*.egg-info*",
  ".venv*",
  ".github*",
]
