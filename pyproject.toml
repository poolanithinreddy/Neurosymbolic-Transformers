[project]
name = "nst"
version = "0.1.0"
description = "Neurosymbolic Transformers (NST): DFOL logic with R-CBM heads for LM training and decoding"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "NST Authors" }]
dependencies = [
  # pinned to requirements.txt
  "torch==2.9.0",
  "transformers==4.46.3",
  "tokenizers>=0.20.1,<0.21",
  "accelerate==0.34.2",
  "peft==0.13.2",
  "datasets==2.21.0",
  "scikit-learn==1.5.2",
  "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = [
  "ruff==0.6.9",
  "black==24.8.0",
  "mypy==1.11.2",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "pre-commit==4.0.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
]
grounding = [
  # spaCy 3.8 adds Python 3.13 compatibility and updated wheels
  "spacy>=3.8.0,<3.9",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
src = ["nst"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = false

[tool.pytest.ini_options]
addopts = "-q --cov=nst --cov-report=term-missing"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nst*"]
exclude = [
  "configs*",
  "data*",
  "colab*",
  "scripts*",
  "tests*",
  "outputs*",
  "outputs_quick*",
  ".venv*",
  ".github*",
]
