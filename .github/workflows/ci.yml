name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Format
        run: |
          ruff format --check .
          black -l 100 --check .
      - name: Lint
        run: |
          ruff .
          mypy nst || true
      - name: Test
        run: |
          pytest -q --cov=nst
